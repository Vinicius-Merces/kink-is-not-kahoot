<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudArena | Revisão das animações</title>
<style>
body{margin:0;background:#111827;color:#e5e7eb;font:15px system-ui;padding:20px}
header{position:sticky;top:0;background:#111827ef;padding:12px;z-index:2;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
a{color:#67e8f9}select,button{padding:10px;background:#243247;color:white;border:1px solid #53647b;border-radius:8px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
article{background:#182337;border:1px solid #344155;border-radius:12px;padding:12px;text-align:center}
canvas{display:block;width:190px;height:190px;margin:auto}article.boss canvas{width:210px;height:210px}
h2{font-size:14px;min-height:40px}small{display:block;color:#aab6c9}
</style></head><body><header><a href="cloudarena.html">Voltar ao CloudArena</a>
<label>Ação <select id="action"><option>idle</option><option>attack</option><option>hurt</option><option>death</option><option>intro</option><option>enrage</option><option>idleEnraged</option><option>attackEnraged</option><option>heavy</option><option>hurtEnraged</option></select></label>
<button id="replay">Reproduzir novamente</button><span id="summary">Carregando catálogo…</span></header><main></main>
<script src="js/cloudarena-sprites.js?v=20261019"></script>
<script>
(async()=>{
 const c=await CloudArenaSprites.loadCatalog();const sprites=[];
 for(const v of [...c.commons,...c.bosses]) {
  const card=document.createElement('article');if(v.level)card.className='boss';
  const title=document.createElement('h2');title.textContent=v.name;
  const canvas=document.createElement('canvas');canvas.width=canvas.height=256;
  const label=document.createElement('small');label.textContent='Carregando…';
  card.append(title,canvas,label);document.querySelector('main').append(card);
  const sprite=new CloudArenaSprites.ArenaSprite(v);sprite.attach(canvas);
  sprites.push({sprite,label});
  sprite.load().then(()=>{sprite.play('idle',{loop:true});label.textContent=v.level?'Boss nível '+v.level:'Níveis '+((v.band-1)*10+1)+' a '+v.band*10;}).catch(e=>{label.textContent=e.message;card.style.borderColor='red';});
 }
 document.querySelector('#summary').textContent=c.commons.length+' inimigos e '+c.bosses.length+' bosses';
 function play(){const state=document.querySelector('#action').value;for(const {sprite,label} of sprites){if(!sprite.variant.animations[state])continue;sprite.play(state,{loop:state.startsWith('idle')});}}
 document.querySelector('#action').onchange=play;document.querySelector('#replay').onclick=play;
})();
</script></body></html>
