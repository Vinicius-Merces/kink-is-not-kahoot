name: Reparar fidelidade EN dos bancos

permissions:
  contents: write

on:
  push:
    branches: [ feat/i18n-foundation ]
    paths:
      - 'translations/repair-requests/**.json'
  workflow_dispatch:
    inputs:
      request:
        description: 'Arquivo JSON em translations/repair-requests/'
        required: true
        default: 'translations/repair-requests/all-exams.json'

concurrency:
  group: repair-exam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolver solicitação
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.request }}" >> "$GITHUB_OUTPUT"
          else
            REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^translations/repair-requests/.*\.json$' | head -n 1)
            test -n "$REQUEST"
            echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar motor de tradução local
        run: |
          python -m pip install --upgrade pip
          pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.44,<5' 'sentencepiece>=0.2,<1'
      - name: Validar sintaxe
        run: |
          python3 -m py_compile scripts/translation_integrity.py
          python3 -m py_compile scripts/offline_mt.py
          python3 -m py_compile scripts/repair_exam_staging_offline.py
          python3 -m py_compile scripts/validate_english_translation_quality.py
      - name: Reparar staging com drift
        run: python3 scripts/repair_exam_staging_offline.py "${{ steps.request.outputs.path }}"
      - name: Validar staging reparado
        run: |
          python3 scripts/validate_exam_translation_staging.py
          python3 scripts/validate_english_translation_quality.py
      - name: Garantir fronteira de staging
        shell: bash
        run: |
          if ! git diff --quiet -- data/exams-en; then
            echo 'ERRO: data/exams-en foi alterado pelo reparador.'
            exit 1
          fi
      - name: Versionar staging reparado
        shell: bash
        run: |
          git add translations/en
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(i18n): repair English exam translation fidelity offline'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
