name: Aplicar UI EN nas páginas internas

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'locales/en/internal-literals.json'
      - 'locales/pt-BR/internal-literals.json'
      - 'js/i18n-internal-literals.js'
      - 'scripts/inject_internal_i18n_adapter.py'
      - '.github/workflows/internal-visual-i18n.yml'
  workflow_dispatch: {}

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Injetar adapter compartilhado
        run: python3 scripts/inject_internal_i18n_adapter.py
      - name: Validar adapter e catálogos
        run: |
          node --check js/i18n-internal-literals.js
          python3 scripts/validate_i18n.py
      - name: Validar referências únicas
        run: |
          for page in admin.html create-quiz.html historico.html host.html my-quizzes.html player.html progresso.html; do
            [ ! -f "$page" ] || test "$(grep -c 'js/i18n-internal-literals.js' "$page")" -eq 1
          done
      - name: Versionar wiring validado
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add admin.html create-quiz.html historico.html host.html my-quizzes.html player.html progresso.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Vinicius-Merces@users.noreply.github.com'
          git commit -m 'feat(i18n): wire shared internal UI localization'
          git push origin "HEAD:${HEAD_BRANCH}"
