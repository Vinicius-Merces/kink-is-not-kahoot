name: Gerar CloudArena EN

permissions:
  contents: write

on:
  push:
    branches: [ feat/i18n-foundation ]
    paths:
      - 'translations/requests-arena/**.json'
  workflow_dispatch:
    inputs:
      request:
        description: 'Arquivo JSON em translations/requests-arena/'
        required: true
        default: 'translations/requests-arena/clf-c02.json'

concurrency:
  group: translate-arena-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolver solicitação
        id: req
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.request }}" >> "$GITHUB_OUTPUT"
          else
            REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^translations/requests-arena/.*\.json$' | head -n 1)
            test -n "$REQUEST"
            echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Validar ferramentas
        run: |
          python3 -m py_compile scripts/build_arena_translation.py
          python3 -m py_compile scripts/validate_arena_locale_parity.py
      - name: Extrair certId
        id: cert
        shell: bash
        run: |
          CERT=$(python3 -c "import json; print(json.load(open('${{ steps.req.outputs.path }}'))['certId'])")
          echo "id=$CERT" >> "$GITHUB_OUTPUT"
      - name: Construir overlay EN com feedback curado
        run: python3 scripts/build_arena_translation.py "${{ steps.cert.outputs.id }}" --write
      - name: Validar paridade PT EN
        run: python3 scripts/validate_arena_locale_parity.py
      - name: Versionar overlay EN validado
        shell: bash
        run: |
          git add data/cloudarena/breakdowns-en
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(i18n): publish curated English CloudArena overlay'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
