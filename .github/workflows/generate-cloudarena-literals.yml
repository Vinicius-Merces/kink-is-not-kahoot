name: Gerar catálogo visual EN da CloudArena

permissions:
  contents: write
  models: read

on:
  pull_request:
    paths:
      - 'scripts/generate_cloudarena_literal_catalog.py'
      - 'cloudarena.html'
      - 'js/cloudarena.js'
      - '.github/workflows/generate-cloudarena-literals.yml'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar catálogos a partir da UI real
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATION_MODEL: openai/gpt-4.1-mini
        run: python3 scripts/generate_cloudarena_literal_catalog.py
      - name: Validar paridade global dos catálogos
        run: python3 scripts/validate_i18n.py
      - name: Versionar catálogos validados
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add locales/pt-BR/cloudarena-literals.json locales/en/cloudarena-literals.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(i18n): add CloudArena visual literal catalogs'
          git push origin "HEAD:${HEAD_BRANCH}"
