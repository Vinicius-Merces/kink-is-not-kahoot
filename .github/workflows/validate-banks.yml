name: Validar conteúdo e i18n

# Valida bancos, overlays do CloudArena e a camada de internacionalização.
permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'locales/**'
      - 'translations/**'
      - 'js/i18n*.js'
      - 'js/nav-menu.js'
      - 'js/tts-reader.js'
      - 'server.js'
      - 'js/simulados.js'
      - 'js/socket-client.js'
      - 'js/simulado-live-host.js'
      - 'scripts/validate_banks.py'
      - 'scripts/validate_arena.py'
      - 'scripts/validate_i18n.py'
      - 'scripts/validate_exam_locale_parity.py'
      - 'scripts/validate_exam_translation_staging.py'
      - 'scripts/validate_aws_current_facts.py'
      - 'scripts/scaffold_exam_translation.py'
      - 'scripts/build_exam_translation.py'
      - 'scripts/promote_complete_exam_translations.py'
      - 'scripts/prepare_arena_option_ids.py'
      - 'scripts/apply_exam_locale_runtime.py'
      - 'scripts/apply_aws_2026_content_fixes.py'
      - '.github/workflows/validate-banks.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'locales/**'
      - 'translations/**'
      - 'js/i18n*.js'
      - 'js/nav-menu.js'
      - 'js/tts-reader.js'
      - 'server.js'
      - 'js/simulados.js'
      - 'js/socket-client.js'
      - 'js/simulado-live-host.js'
      - 'scripts/validate_banks.py'
      - 'scripts/validate_arena.py'
      - 'scripts/validate_i18n.py'
      - 'scripts/validate_exam_locale_parity.py'
      - 'scripts/validate_exam_translation_staging.py'
      - 'scripts/validate_aws_current_facts.py'
      - 'scripts/scaffold_exam_translation.py'
      - 'scripts/build_exam_translation.py'
      - 'scripts/promote_complete_exam_translations.py'
      - 'scripts/prepare_arena_option_ids.py'
      - 'scripts/apply_exam_locale_runtime.py'
      - 'scripts/apply_aws_2026_content_fixes.py'
      - '.github/workflows/validate-banks.yml'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxe das ferramentas de tradução e conteúdo
        run: |
          python3 -m py_compile scripts/validate_i18n.py
          python3 -m py_compile scripts/validate_exam_locale_parity.py
          python3 -m py_compile scripts/validate_exam_translation_staging.py
          python3 -m py_compile scripts/validate_aws_current_facts.py
          python3 -m py_compile scripts/scaffold_exam_translation.py
          python3 -m py_compile scripts/build_exam_translation.py
          python3 -m py_compile scripts/promote_complete_exam_translations.py
          python3 -m py_compile scripts/prepare_arena_option_ids.py
          python3 -m py_compile scripts/apply_exam_locale_runtime.py
          python3 -m py_compile scripts/apply_aws_2026_content_fixes.py

      - name: Aplicar correções factuais AWS verificadas em 2026
        run: python3 scripts/apply_aws_2026_content_fixes.py

      - name: Validar fatos AWS sensíveis a data
        run: python3 scripts/validate_aws_current_facts.py

      - name: Aplicar migração locale-aware em workspace
        run: python3 scripts/apply_exam_locale_runtime.py

      - name: Validar sintaxe do runtime i18n e simulados
        run: |
          node --check server.js
          node --check js/i18n.js
          node --check js/i18n-shared.js
          node --check js/i18n-home.js
          node --check js/i18n-simulados.js
          node --check js/nav-menu.js
          node --check js/tts-reader.js
          node --check js/simulados.js
          node --check js/socket-client.js
          node --check js/simulado-live-host.js

      - name: Validar bancos de questões
        run: python3 scripts/validate_banks.py

      - name: Validar lotes EN em staging
        run: python3 scripts/validate_exam_translation_staging.py

      - name: Promover automaticamente bancos EN completos
        run: python3 scripts/promote_complete_exam_translations.py

      - name: Validar paridade dos bancos EN prontos
        run: python3 scripts/validate_exam_locale_parity.py

      - name: Publicar bancos EN validados
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-banks-ready
          path: data/exams-en/**/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Validar overlays do CloudArena
        run: python3 scripts/validate_arena.py

      - name: Validar contrato de IDs do CloudArena
        run: python3 scripts/prepare_arena_option_ids.py

      - name: Validar catálogos PT e EN
        run: python3 scripts/validate_i18n.py

      - name: Versionar artefatos validados no PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add data/exams data/exams-en server.js js/simulados.js js/socket-client.js js/simulado-live-host.js
          if git diff --cached --quiet; then
            echo 'Artefatos gerados já estão versionados e idênticos ao workspace validado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(i18n): promote validated English exam banks'
          git push origin "HEAD:${HEAD_BRANCH}"
